<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AirSen — İdarəetmə Sisteminə Giriş</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="images/logo.png">
    
    <!-- Google Fonts (Plus Jakarta Sans & Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
    
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="admin-login-body">
    <div class="login-ambient-orb orb-purple"></div>
    <div class="login-ambient-orb orb-cyan"></div>

    <div class="admin-login-container">
        <div class="admin-login-card">
            <!-- Brand Header -->
            <div class="login-brand-header">
                <a href="index.html" class="login-logo-link" title="AirSen Ana Səhifə">
                    <img src="images/logo.png" alt="AirSen" class="login-logo-img">
                </a>
                
                <div class="login-badge-pill">
                    <span class="badge-dot-live"></span>
                    <span>İDARƏETMƏ PANELİ & ANALİTİKA</span>
                </div>

                <h1 class="login-title">Xoş Gəlmisiniz</h1>
                <p class="login-subtitle">Platformanı idarə etmək üçün hesabınıza daxil olun.</p>
            </div>

            <!-- Login Tabs (Email/Şifrə vs Master PIN) -->
            <div class="login-tabs">
                <button type="button" class="login-tab-btn active" id="tabBtnEmail">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                    Email & Şifrə
                </button>
                <button type="button" class="login-tab-btn" id="tabBtnPin">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                    Sürətli PIN
                </button>
            </div>

            <!-- Form: Email & Password -->
            <form id="formEmailLogin" class="login-form">
                <div class="form-group">
                    <label class="form-label" for="loginEmail">E-poçt ünvanı</label>
                    <div class="input-with-icon">
                        <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                        <input type="email" name="email" id="loginEmail" class="form-input" placeholder="admin@airsen.com" value="admin@airsen.com" required autofocus>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="loginPassword">Şifrə</label>
                    <div class="input-with-icon">
                        <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        <input type="password" name="password" id="loginPassword" class="form-input" placeholder="••••••••" value="airsen2026" required>
                        <button type="button" class="password-toggle-btn" id="togglePasswordBtn" aria-label="Şifrəni göstər">
                            <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                </div>

                <div class="login-options-row">
                    <label class="custom-checkbox-label">
                        <input type="checkbox" name="remember" checked>
                        <span>Məni xatırla</span>
                    </label>
                </div>

                <button type="submit" class="btn-login-submit" id="btnSubmitEmail">
                    <span>Sistemə Daxil Ol</span>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                </button>
            </form>

            <!-- Form: Quick PIN -->
            <form id="formPinLogin" class="login-form" style="display: none;">
                <div class="form-group">
                    <label class="form-label" for="loginPin">Təsisçi Master PIN Kodu</label>
                    <div class="input-with-icon">
                        <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        <input type="password" name="pin" id="loginPin" class="form-input" placeholder="PIN daxil edin (məs: airsen2026)" value="airsen2026">
                    </div>
                </div>

                <button type="submit" class="btn-login-submit btn-login-pin" id="btnSubmitPin">
                    <span>PIN ilə Giriş</span>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                </button>
            </form>

            <!-- Bottom Back Link -->
            <div class="login-footer">
                <a href="index.html" class="back-home-link">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m15 18-6-6 6-6"/></svg>
                    <span>Əsas Sayta Qayıt</span>
                </a>
            </div>
        </div>
    </div>

    <!-- Interactive Script -->
    <script>
        // Tab switching
        const tabBtnEmail = document.getElementById('tabBtnEmail');
        const tabBtnPin = document.getElementById('tabBtnPin');
        const formEmail = document.getElementById('formEmailLogin');
        const formPin = document.getElementById('formPinLogin');

        tabBtnEmail.addEventListener('click', () => {
            tabBtnEmail.classList.add('active');
            tabBtnPin.classList.remove('active');
            formEmail.style.display = 'block';
            formPin.style.display = 'none';
        });

        tabBtnPin.addEventListener('click', () => {
            tabBtnPin.classList.add('active');
            tabBtnEmail.classList.remove('active');
            formEmail.style.display = 'none';
            formPin.style.display = 'block';
            document.getElementById('loginPin')?.focus();
        });

        // Password Toggle
        const toggleBtn = document.getElementById('togglePasswordBtn');
        const passwordInput = document.getElementById('loginPassword');
        toggleBtn?.addEventListener('click', () => {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            toggleBtn.style.color = isPassword ? 'var(--purple-main)' : 'var(--text-dim)';
        });

        // Form Submit Handler
        function handleLoginSuccess() {
            sessionStorage.setItem('airsen_admin_auth', '1');
            Swal.fire({
                icon: 'success',
                title: 'Uğurla Daxil Oldunuz!',
                text: 'İdarəetmə Panelinə yönləndirilirsiniz...',
                timer: 1200,
                showConfirmButton: false,
                background: '#16161C',
                color: '#FFFFFF'
            }).then(() => {
                window.location.href = 'admin.html';
            });
        }

        formEmail.addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            if (email && password) {
                handleLoginSuccess();
            } else {
                Swal.fire({
                    icon: 'error',
                    title: 'Xəta',
                    text: 'Zəhmət olmasa email və şifrənizi daxil edin.',
                    background: '#16161C',
                    color: '#FFFFFF',
                    confirmButtonColor: '#C042F0'
                });
            }
        });

        formPin.addEventListener('submit', (e) => {
            e.preventDefault();
            const pin = document.getElementById('loginPin').value.trim();
            if (pin) {
                handleLoginSuccess();
            } else {
                Swal.fire({
                    icon: 'error',
                    title: 'Xəta',
                    text: 'Zəhmət olmasa master PIN kodunu daxil edin.',
                    background: '#16161C',
                    color: '#FFFFFF',
                    confirmButtonColor: '#C042F0'
                });
            }
        });
    </script>
</body>
</html>
